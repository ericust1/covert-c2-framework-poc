version: "3.8"

services:
  c2-server:
    build:
      context: ..
      dockerfile: lab/docker/Dockerfile.server
    container_name: c2-server
    ports:
      - "8080:8080"
    environment:
      - C2_HOST=0.0.0.0
      - C2_PORT=8080
      - C2_SECRET_KEY=changeme_secret_key_32bytes!!
    networks:
      c2-lab:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns-server
    ports:
      - "10053:53/udp"
      - "10053:53/tcp"
    volumes:
      - ./bind-config:/etc/bind
      - ./bind-zones:/var/lib/bind
    networks:
      c2-lab:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  agent-container:
    build:
      context: ..
      dockerfile: lab/docker/Dockerfile.agent
    container_name: agent-container
    environment:
      - C2_SERVER_URL=http://172.28.0.10:8080
      - C2_SECRET_KEY=changeme_secret_key_32bytes!!
      - C2_BEACON_INTERVAL=60
      - C2_JITTER=0.2
    dns: 172.28.0.20
    networks:
      c2-lab:
        ipv4_address: 172.28.0.30
    depends_on:
      - c2-server
      - dns-server
    restart: unless-stopped

networks:
  c2-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
